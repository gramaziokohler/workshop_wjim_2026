[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wjim_lib"
description = "With Joints in Mind workshop library: BTLx 2.3 processings on top of compas_timber 3.0.2, and their toolpaths."
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["compas_timber==3.0.2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "compas_brep[occ]; python_version >= '3.10'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
line-length = 179

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["wjim_lib"]
