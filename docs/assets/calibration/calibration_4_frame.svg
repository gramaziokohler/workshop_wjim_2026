ont-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >the beam runs this way</text><text x="620.0" y="344.0" font-size="17" fill="#ff5fa8" text-anchor="start" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >Y</text><text x="702.0" y="344.0" font-size="17" fill="#f8ebe6" text-anchor="start" font-weight="400" font-family="'Roboto Mono', Menlo, monospace" >C → A</text><text x="702.0" y="365.0" font-size="14" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >squared up to X</text><text x="620.0" y="398.0" font-size="17" fill="#f8ebe6" text-anchor="start" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >Z</text><text x="702.0" y="398.0" font-size="17" fill="#f8ebe6" text-anchor="start" font-weight="400" font-family="'Roboto Mono', Menlo, monospace" >X × Y</text><text x="702.0" y="419.0" font-size="14" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >up, or the points are refused</text><text x="620.0" y="470.0" font-size="14" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >the check</text><text x="620.0" y="502.0" font-size="17" fill="#f8ebe6" text-anchor="start" font-weight="400" font-family="'Roboto Mono', Menlo, monospace" >AB to AC: 89.4°</text><text x="620.0" y="526.0" font-size="14" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >far from 90°: a point was measured wrong</text></svg>