<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Side view: the bit wall touches the clamped beam while the tip sits one radius, 3 mm, away from its face."><defs><pattern id="g2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#3b1a22"/><line x1="0" y1="0" x2="0" y2="9" stroke="#6b3c46" stroke-width="1.6"/></pattern></defs><rect width="1000" height="430" fill="#19040b"/><rect x="90.0" y="340.0" width="820.0" height="30.0" fill="#2a0c16" stroke="#8f6571" stroke-width="1.2" /><text x="110.0" y="361.0" font-size="14" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >fabrication surface</text><rect x="240.0" y="230.0" width="190.0" height="110.0" fill="url(#g2)" stroke="#f8ebe6" stroke-width="1.8" /><text x="335.0" y="216.0" font-size="15" fill="#b39aa0" text-anchor="middle" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >clamped beam, cut across</text><path d="M430.0,60.0 L430.0,340.0 L554.0,340.0 L554.0,60.0Z" fill="#6b2a3f" stroke="#f8ebe6" stroke-width="1.8" stroke-linejoin="round" /><path d="M430.0,322.0 L554.0,276.0" fill="none" stroke="#a0586c" stroke-width="1.5" stroke-linejoin="round" /><path d="M430.0,260.0 L554.0,214.0" fill="none" stroke="#a0586c" stroke-width="1.5" stroke-linejoin="round" /><path d="M430.0,198.0 L554.0,152.0" fill="none" stroke="#a0586c" stroke-width="1.5" stroke-linejoin="round" /><path d="M430.0,136.0 L554.0,90.0" fill="none" stroke="#a0586c" stroke-width="1.5" stroke-linejoin="round" /><rect x="428.0" y="50.0" width="128.0" height="14.0" fill="#19040b" stroke="none" stroke-width="1.5" /><path d="M424.0,62.0 L461.0,56.0 L492.0,64.0 L523.0,56.0 L560.0,62.0" fill="none" stroke="#f8ebe6" stroke-width="1.2" stroke-linejoin="round" /><line x1="492.0" y1="36.0" x2="492.0" y2="402.0" stroke="#f8ebe6" stroke-width="1.4" stroke-dasharray="16 5 3 5"/><text x="492.0" y="28.0" font-size="15" fill="#b39aa0" text-anchor="middle" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >bit axis</text><line x1="430.0" y1="232.0" x2="430.0" y2="402.0" stroke="#ffc23d" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="492.0" y1="390.0" x2="438.8" y2="390.0" stroke="#ffc23d" stroke-width="2.4" /><path d="M430.0,390.0 L441.0,394.6 L441.0,385.4Z" fill="#ffc23d" stroke="none" stroke-width="1.5" stroke-linejoin="round" /><text x="461.0" y="416.0" font-size="17" fill="#ffc23d" text-anchor="middle" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >r = 3 mm</text><circle cx="492.0" cy="340.0" r="7" fill="#f8ebe6" stroke="#19040b" stroke-width="2"/><circle cx="430.0" cy="340.0" r="7" fill="#ffc23d" stroke="#19040b" stroke-width="2"/><line x1="500.0" y1="336.0" x2="650.0" y2="250.0" stroke="#b39aa0" stroke-width="1" /><text x="656.0" y="246.0" font-size="17" fill="#f8ebe6" text-anchor="start" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >what the robot reports</text><text x="656.0" y="268.0" font-size="15" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >the tip, on the bit’s axis</text><line x1="423.0" y1="346.0" x2="250.0" y2="392.0" stroke="#b39aa0" stroke-width="1" /><text x="244.0" y="392.0" font-size="17" fill="#ffc23d" text-anchor="end" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >what we want</text><text x="244.0" y="414.0" font-size="15" fill="#b39aa0" text-anchor="end" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >the face of the beam</text><text x="656.0" y="312.0" font-size="15" fill="#f8ebe6" text-anchor="start" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >z needs no offset:</text><text x="782.0" y="312.0" font-size="15" fill="#b39aa0" text-anchor="start" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" >the tip stands on the surface</text><line x1="431.0" y1="130.0" x2="431.0" y2="228.0" stroke="#19040b" stroke-width="0" /><line x1="330.0" y1="110.0" x2="427.0" y2="170.0" stroke="#b39aa0" stroke-width="1" /><text x="324.0" y="106.0" font-size="15" fill="#f8ebe6" text-anchor="end" font-weight="700" font-family="Roboto, Helvetica, Arial, sans-serif" >the wall of the bit touches, not its tip</text></svg>