<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" font-family="DIN Alternate, Barlow, Helvetica Neue, Arial, sans-serif">
  <style>
    .b { fill: #1d0710; stroke-width: 1.3; }
    .n { fill: #8f6571; font-weight: 700; font-size: 22px; }
    .t { fill: #f8ebe6; font-size: 11px; font-weight: 700; }
    .s { font-size: 10px; font-weight: 700; }
  </style>
  <!-- flow line -->
  <line x1="10" y1="20" x2="790" y2="20" stroke="#8a5a5f" stroke-dasharray="6.4 4.3"/>
  <text x="790" y="12" text-anchor="end" fill="#8a5a5f" font-size="10">left → right</text>

  <g transform="translate(10 35)"><rect class="b" width="88" height="110" stroke="#f8ebe6"/><text class="n" x="10" y="32">1</text><text class="t" x="10" y="60">Design</text><text class="t" x="10" y="75">centerlines</text></g>
  <g transform="translate(108 35)"><rect class="b" width="88" height="110" stroke="#f8ebe6"/><text class="n" x="10" y="32">2</text><text class="t" x="10" y="60">Beams</text><text class="t" x="10" y="75">by category</text></g>
  <g transform="translate(206 35)"><rect class="b" width="88" height="110" stroke="#f8ebe6"/><text class="n" x="10" y="32">3</text><text class="t" x="10" y="60">Joint</text><text class="t" x="10" y="75">rules</text></g>
  <g transform="translate(304 35)"><rect class="b" width="88" height="110" stroke="#ff5fa8"/><text class="n" x="10" y="32">4</text><text class="t" x="10" y="60">Junctions</text><text class="t" x="10" y="75">3+ beams</text></g>
  <g transform="translate(402 35)"><rect class="b" width="88" height="110" stroke="#ff5fa8"/><text class="n" x="10" y="32">5</text><text class="t" x="10" y="60">To the</text><text class="t" x="10" y="75">editor</text></g>
  <g transform="translate(500 35)"><rect class="b" width="88" height="110" stroke="#f8ebe6"/><text class="n" x="10" y="32">6</text><text class="t" x="10" y="60">Back from</text><text class="t" x="10" y="75">the editor</text></g>
  <g transform="translate(598 35)"><rect class="b" width="88" height="110" stroke="#f8ebe6"/><text class="n" x="10" y="32">7</text><text class="t" x="10" y="60">Model</text></g>
  <g transform="translate(696 35)"><rect class="b" width="94" height="110" stroke="#ffc23d"/><text class="n" x="10" y="32">8</text><text class="t" x="10" y="60">Fabrication</text><text class="t" x="10" y="75">toolpaths</text><text class="t" x="10" y="90">robot</text></g>

  <text class="s" x="10" y="170" fill="#f8ebe6">STEP 02</text>
  <text class="s" x="304" y="170" fill="#ff5fa8">STEP 03</text>
  <text class="s" x="500" y="170" fill="#f8ebe6">STEP 05</text>
  <text class="s" x="598" y="170" fill="#f8ebe6">STEP 02</text>
  <text class="s" x="696" y="170" fill="#ffc23d">STEP 07</text>
