<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" font-family="DIN Alternate, Barlow, Helvetica Neue, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a5a5f"/></marker></defs>
  <style>
    .b { fill: #1d0710; stroke-width: 1.3; }
    .t { fill: #f8ebe6; font-size: 12px; font-weight: 700; }
    .s { fill: #b39aa0; font-size: 10.5px; }
    .l { stroke: #8a5a5f; stroke-width: 1.3; marker-end: url(#a); }
  </style>
  <g transform="translate(10 30)"><rect class="b" width="140" height="100" stroke="#ff5fa8"/><text class="t" x="12" y="28">Fixture</text><text class="s" x="12" y="52">beams</text><text class="s" x="12" y="68">role_bindings</text><text class="s" x="12" y="84">params</text></g>
  <line class="l" x1="150" y1="80" x2="170" y2="80"/>
  <g transform="translate(172 30)"><rect class="b" width="150" height="100" stroke="#4fd6e0"/><text class="t" x="12" y="28">__init__()</text><text class="s" x="12" y="52">edge_a, edge_b,</text><text class="s" x="12" y="68">post,</text><text class="s" x="12" y="84" fill="#4fd6e0">step_depth=15.0</text></g>
  <line class="l" x1="322" y1="80" x2="342" y2="80"/>
  <g transform="translate(344 30)"><rect class="b" width="150" height="100" stroke="#4fd6e0"/><text class="t" x="12" y="28">add_extensions()</text><text class="s" x="12" y="52">lengthen blanks</text><text class="s" x="12" y="68">that must reach</text><text class="s" x="12" y="84">past the joint</text></g>
  <line class="l" x1="494" y1="80" x2="514" y2="80"/>
  <g transform="translate(516 30)"><rect class="b" width="130" height="100" stroke="#4fd6e0"/><text class="t" x="12" y="28">add_features()</text><text class="s" x="12" y="52">put processings</text><text class="s" x="12" y="68">on the beams</text></g>
  <line class="l" x1="646" y1="80" x2="666" y2="80"/>
  <g transform="translate(668 30)"><rect class="b" width="122" height="100" stroke="#ffc23d"/><text class="t" x="12" y="28">BTLx</text><text class="s" x="12" y="52">StepJoint</text><text class="s" x="12" y="68">StepJointNotch</text><text class="s" x="12" y="84">Lap, Drilling …</text></g>
  <text x="10" y="160" fill="#8f6571" font-size="11" font-weight="700">one Run = Fixture in → geometry out · runs again as you type</text>
