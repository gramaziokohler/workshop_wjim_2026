<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="DIN Alternate, Barlow, Helvetica Neue, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a5a5f"/></marker></defs>
  <style>
    .b { fill: #1d0710; stroke-width: 1.3; }
    .n { fill: #8f6571; font-size: 20px; font-weight: 700; }
    .t { fill: #f8ebe6; font-size: 12px; font-weight: 700; }
    .s { fill: #b39aa0; font-size: 10.5px; }
    .l { stroke: #8a5a5f; stroke-width: 1.3; marker-end: url(#a); }
  </style>
  <g transform="translate(10 30)"><rect class="b" width="140" height="110" stroke="#f8ebe6"/><text class="n" x="12" y="30">1</text><text class="t" x="12" y="58">beam</text><text class="s" x="12" y="80">which beam of</text><text class="s" x="12" y="96">the junction</text></g>
  <line class="l" x1="150" y1="85" x2="170" y2="85"/>
  <g transform="translate(172 30)"><rect class="b" width="140" height="110" stroke="#f8ebe6"/><text class="n" x="12" y="30">2</text><text class="t" x="12" y="58">side</text><text class="s" x="12" y="80">reference side</text><text class="s" x="12" y="96">facing up (0–3)</text></g>
  <line class="l" x1="312" y1="85" x2="332" y2="85"/>
  <g transform="translate(334 30)"><rect class="b" width="140" height="110" stroke="#ffc23d"/><text class="n" x="12" y="30">3</text><text class="t" x="12" y="58" fill="#ffc23d">compute</text><text class="s" x="12" y="80">press it ·</text><text class="s" x="12" y="96">nothing runs before</text></g>
  <line class="l" x1="474" y1="85" x2="494" y2="85"/>
  <g transform="translate(496 30)"><rect class="b" width="140" height="110" stroke="#ffc23d"/><text class="n" x="12" y="30">4</text><text class="t" x="12" y="58">t</text><text class="s" x="12" y="80">scrub 0 → 1</text><text class="s" x="12" y="96">the robot follows</text></g>
  <line class="l" x1="636" y1="85" x2="656" y2="85"/>
  <g transform="translate(658 30)"><rect class="b" width="132" height="110" stroke="#f8ebe6"/><text class="n" x="12" y="30">5</text><text class="t" x="12" y="58">unreachable</text><text class="s" x="12" y="80">empty? good.</text><text class="s" x="12" y="96">not? change side</text></g>
  <text x="10" y="180" fill="#8f6571" font-size="11" font-weight="700">6 mm bit · one side per setup · the beam's reference corner sits where Calibration says</text>
</svg>
