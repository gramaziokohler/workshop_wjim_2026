<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="DIN Alternate, Barlow, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff5fa8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f8ebe6"/></marker>
  </defs>
  <style>
    .b { fill: #1d0710; stroke-width: 1.3; }
    .t { fill: #f8ebe6; font-size: 13px; font-weight: 700; }
    .s { fill: #b39aa0; font-size: 11px; }
    .k { fill: #520f22; stroke: #8f6571; }
  </style>

  <!-- Export Junction component -->
  <rect class="b" x="20" y="40" width="190" height="130" stroke="#f8ebe6"/>
  <text class="t" x="35" y="68">Export Junction</text>
  <text class="s" x="35" y="95">name</text><rect class="k" x="85" y="83" width="110" height="18"/><text class="s" x="92" y="96" fill="#f8ebe6">corner_node</text>
  <text class="s" x="35" y="122">reach</text><text class="s" x="92" y="122" fill="#f8ebe6">600</text>
  <rect x="35" y="135" width="70" height="22" fill="#ff5fa8"/><text x="45" y="150" font-size="12" font-weight="700" fill="#19040b">export</text>

  <!-- two files -->
  <path d="M210 90 C 260 90, 260 60, 300 60" fill="none" stroke="#ff5fa8" stroke-width="1.5" marker-end="url(#w)"/>
  <path d="M210 120 C 260 120, 260 150, 300 150" fill="none" stroke="#ff5fa8" stroke-width="1.5" marker-end="url(#w)"/>

  <rect class="b" x="305" y="25" width="250" height="70" stroke="#ff5fa8"/>
  <text class="t" x="320" y="50">corner_node.fixture.json</text>
  <text class="s" x="320" y="70">the beams, cropped and centred</text>
  <text class="s" x="320" y="86" fill="#ff5fa8">rewritten on every export</text>

  <rect class="b" x="305" y="115" width="250" height="70" stroke="#4fd6e0"/>
  <text class="t" x="320" y="140">corner_node.py</text>
  <text class="s" x="320" y="160">a joint module to start from</text>
  <text class="s" x="320" y="176" fill="#4fd6e0">written once · then it's yours</text>

  <!-- VS Code -->
  <line x1="555" y1="105" x2="600" y2="105" stroke="#4fd6e0" stroke-width="1.5"/>
  <rect class="b" x="600" y="55" width="180" height="100" stroke="#4fd6e0"/>
  <text class="t" x="615" y="85">VS Code</text>
  <text class="s" x="615" y="108">opens by itself</text>
  <text class="s" x="615" y="126">viewport tab beside</text>
  <text class="s" x="615" y="142">the code</text>

  <!-- back -->
  <path d="M690 155 C 690 280, 400 285, 215 280" fill="none" stroke="#f8ebe6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text class="s" x="470" y="300" fill="#f8ebe6">save in VS Code → Grasshopper re-solves</text>
  <rect class="b" x="20" y="235" width="190" height="80" stroke="#f8ebe6"/>
  <text class="t" x="35" y="260">Custom Joints</text>
  <text class="s" x="35" y="283">assign</text>
  <rect class="k" x="85" y="271" width="110" height="18"/><text class="s" x="92" y="284" fill="#f8ebe6">0: corner_node</text>
</svg>
