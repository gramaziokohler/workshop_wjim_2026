<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="DIN Alternate, Barlow, Helvetica Neue, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4fd6e0"/></marker></defs>
  <style>
    .t { fill: #f8ebe6; font-size: 13px; font-weight: 700; }
    .s { fill: #b39aa0; font-size: 11px; }
    .post { stroke: #f8ebe6; stroke-width: 7; stroke-linecap: square; }
    .ea { stroke: #ffc23d; stroke-width: 5; }
    .eb { stroke: #ff5fa8; stroke-width: 5; }
    .l { stroke: #4fd6e0; stroke-width: 1.3; fill: none; marker-end: url(#a); }
  </style>
  <rect x="300" y="15" width="200" height="56" fill="#1d0710" stroke="#4fd6e0" stroke-width="1.3"/>
  <text class="t" x="318" y="40">corner_node.py</text>
  <text class="s" x="318" y="58">one module</text>

  <path class="l" d="M330 71 C 300 120, 120 110, 110 150"/>
  <path class="l" d="M380 71 C 370 120, 300 120, 300 150"/>
  <path class="l" d="M420 71 C 430 120, 500 120, 500 150"/>
  <path class="l" d="M470 71 C 500 120, 690 110, 690 150"/>

  <!-- four corners, each a post with two edges at its own slope -->
  <g transform="translate(110 215)"><line class="post" x1="0" y1="0" x2="0" y2="45"/><line class="ea" x1="0" y1="0" x2="60" y2="-16"/><line class="eb" x1="0" y1="0" x2="-45" y2="-22"/><text class="t" x="-20" y="-35">J0</text></g>
  <g transform="translate(300 215)"><line class="post" x1="0" y1="0" x2="0" y2="45"/><line class="ea" x1="0" y1="0" x2="60" y2="16"/><line class="eb" x1="0" y1="0" x2="-45" y2="-22"/><text class="t" x="-20" y="-35">J1</text></g>
  <g transform="translate(500 215)"><line class="post" x1="0" y1="0" x2="0" y2="45"/><line class="ea" x1="0" y1="0" x2="60" y2="-16"/><line class="eb" x1="0" y1="0" x2="-45" y2="22"/><text class="t" x="-20" y="-35">J3</text></g>
  <g transform="translate(690 215)"><line class="post" x1="0" y1="0" x2="0" y2="45"/><line class="ea" x1="0" y1="0" x2="60" y2="16"/><line class="eb" x1="0" y1="0" x2="-45" y2="22"/><text class="t" x="-20" y="-35">J4</text></g>
  <text class="s" x="10" y="275">same code · different angles, lengths, sections · read them from the beams, don't type them</text>
</svg>
