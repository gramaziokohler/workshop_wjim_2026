# The COMPAS RRC driver, between send_to_robot.py and the controller.
#   docker compose -f robot/docker-compose.yml up -d                        # the real controller (service port)
#   ROBOT_IP=10.211.55.3 docker compose -f robot/docker-compose.yml up -d   # RobotStudio in a VM: the VM's IP
name: rrc
services:
  ros-master:
    image: compasrrc/compas_rrc_driver:v1.1.2
    environment:
      - ROS_HOSTNAME=ros-master
      - ROS_MASTER_URI=http://ros-master:11311
    command: ["roscore"]

  ros-bridge:
    image: compasrrc/compas_rrc_driver:v1.1.2
    environment:
      - ROS_HOSTNAME=ros-bridge
      - ROS_MASTER_URI=http://ros-master:11311
    ports:
      - "9090:9090"
    depends_on:
      - ros-master
    # The long unregister timeout works around https://github.com/RobotWebTools/rosbridge_suite/issues/138
    command: ["roslaunch", "--wait", "rosbridge_server", "rosbridge_websocket.launch", "unregister_timeout:=28800"]

  abb-driver:
    image: compasrrc/compas_rrc_driver:v1.1.2
    environment:
      - ROS_HOSTNAME=abb-driver
      - ROS_MASTER_URI=http://ros-master:11311
    depends_on:
      - ros-master
    command:
      - roslaunch
      - --wait
      - compas_rrc_driver
      - bringup.launch
      - robot_ip:=${ROBOT_IP:-192.168.125.1}
      - robot_streaming_port:=30101
      - robot_state_port:=30201
      - namespace:=rob1
