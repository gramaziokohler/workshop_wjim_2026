[project]
name = "workshop_wjim_2026"
version = "0.0.0"
description = "One environment for the tutorial site and the processing lab (not the Rhino venv, that is 00_install.ghx)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "compas_timber==3.0.2",
    "compas_brep[occ]==0.4.2",
    "compas_fab",
    "compas_fab_native",
    "compas_robots",
    "wjim_lib",
]

[dependency-groups]
docs = ["zensical"]

[tool.uv]
package = false
default-groups = ["docs"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'win32'"]

[tool.uv.sources]
wjim_lib = { path = "wjim_lib", editable = true }

# Pylance reads this too: the joint editor's environment has no wjim_lib. Not in .vscode/settings.json,
# which the Python Environments extension rewrites when an interpreter is selected.
[tool.pyright]
extraPaths = ["wjim_lib/src"]
