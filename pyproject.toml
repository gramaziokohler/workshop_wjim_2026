[project]
name = "workshop_wjim_2026"
version = "0.0.0"
description = "One environment for the tutorial site and the processing lab (not the Rhino venv, that is 00_install.ghx)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "compas==2.15.1",  # shortcut: compas 2.16 breaks compas_timber 3.0.0 (closed polylines); lift with the release of compas_timber's compas_216 branch
    "compas_timber==3.0.0",
    "compas_brep[occ]==0.4.2",
    "compas_fab",
    "compas_fab_native",
    "compas_robots",
    "wjim_lib",
]

[dependency-groups]
docs = ["zensical"]

[tool.uv]
package = false
default-groups = ["docs"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'win32'"]

[tool.uv.sources]
wjim_lib = { path = "wjim_lib", editable = true }
